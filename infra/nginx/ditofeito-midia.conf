# Bloco inicial HTTP — mesmo padrão de infra/nginx/ditofeito.conf: o certbot
# reescreve este arquivo em produção pra acrescentar o server{} de 443/ssl +
# redirect 80->443. Versão pré-certbot aqui só para referência/histórico; o
# arquivo real vive em /etc/nginx/sites-available/ditofeito-midia na VPS
# depois que o certbot roda (ver infra/nginx/README.md).
#
# img.ditofeito.com / envio.ditofeito.com: serviço estático de imagens (cards
# gerados, uploads etc.), SEM relação com o /card/:slug.png da API principal
# (esse é servido em ditofeito.com mesmo, via apps/api — ver embed.ts). Raiz
# em /var/www/imagens/ditofeito, que é uma pasta de mídia compartilhada da
# VPS (tem uma pasta irmã /var/www/imagens/<outro-app> pra outro projeto do
# mesmo servidor — não confundir/misturar).
#
# ATENÇÃO: reaplicar este arquivo por cima do arquivo em produção destrói o
# server{} de SSL que o certbot adicionou — sempre rodar certbot --expand
# (comando abaixo) logo em seguida.
#
# certbot --nginx -d img.ditofeito.com -d envio.ditofeito.com \
#   --cert-name img.ditofeito.com --expand \
#   --non-interactive --agree-tos -m trilhascodo@gmail.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name img.ditofeito.com envio.ditofeito.com;

    root /var/www/imagens/ditofeito;

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
}
